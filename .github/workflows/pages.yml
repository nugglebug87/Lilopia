# Publishes the LILOPIA web app to GitHub Pages after the rule tests pass.
# One-time setup: repository Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/android.yml
    permissions:
      contents: read
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test the game rules
        run: node --test tests/*.test.js
      - run: node tools/update-cache.cjs --check
      - name: Collect the web app files
        run: |
          mkdir site
          cp -r index.html manifest.webmanifest sw.js privacy-policy.html terms-of-use.html src assets fonts icons site/
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
