# Publishes the LILOPIA web app and website to GitHub Pages after the rule tests pass.
# One-time setup: repository Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test the game rules
        run: node --test tests/*.test.js
      - name: Assemble the website and browser game
        run: |
          mkdir -p site/play
          cp -r website galaxy fonts icons privacy-policy.html terms-of-use.html site/
          cp -r index.html manifest.webmanifest sw.js src assets fonts icons privacy-policy.html terms-of-use.html site/play/
          sed -i 's|href="../"|href="../play/"|' site/website/index.html
          sed 's|href="../|href="|g; s|href="site.css"|href="website/site.css"|; s|src="images/|src="website/images/|g' site/website/index.html > site/index.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
