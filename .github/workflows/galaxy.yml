name: Galaxy IAP candidate
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  galaxy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sandbox: ['false', 'true']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: npm ci
      - run: npm test
      - run: node tools/update-cache.cjs --check
      - run: npx playwright install --with-deps chromium
      - run: node tests/e2e/android-release.js
      - name: Build and test Samsung production or sandbox candidate
        run: bash android/gradlew -p android -Pdistribution=galaxy -PgalaxyTest=${{ matrix.sandbox }} assembleRelease bundleRelease lintRelease testReleaseUnitTest --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: lilopia-galaxy-sandbox-${{ matrix.sandbox }}-unsigned
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/release/*unsigned.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/reports/lint-results-release.*
            android/app/build/test-results/testReleaseUnitTest/*.xml
