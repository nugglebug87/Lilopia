name: Android release candidate
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: node --test tests/*.test.js
      - name: Install Playwright Chromium for browser coverage
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run game interaction tests, including zoom
        run: |
          mkdir -p /tmp/lilopia-e2e
          node tests/e2e/interactions.js "$GITHUB_WORKSPACE/index.html" /tmp/lilopia-e2e
      - name: Run screen and save/continue checks
        run: node tests/e2e/screens.js "$GITHUB_WORKSPACE/index.html" /tmp/lilopia-e2e
      - name: Run distribution ownership and save regression checks
        run: node --test tests/galaxy.test.js
      - run: bash android/gradlew -p android bundleRelease lintRelease testReleaseUnitTest --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: lilopia-unsigned-release-candidate
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/reports/lint-results-release.html
