name: Android release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: node --test tests/*.test.js
      - run: bash android/gradlew -p android bundleRelease lintRelease testReleaseUnitTest --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: lilopia-unsigned-release-candidate
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/reports/lint-results-release.html
