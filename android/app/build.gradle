plugins {
    id 'com.android.application'
}

// The game itself lives at the repository root (index.html, src/, assets/).
// It is copied into the APK at build time so there is one copy of the game to maintain.
def gameRoot = rootProject.file('..')
def gameAssets = layout.buildDirectory.dir('generated/gameAssets')

def copyGame = tasks.register('copyGame', Sync) {
    from(gameRoot) {
        include 'index.html'
        // The installable-web-app tags (manifest, icons) are not needed inside the app.
        def inPwa = false
        filter { String line ->
            if (line.contains('@@PWA-START@@')) { inPwa = true; return null }
            if (line.contains('@@PWA-END@@')) { inPwa = false; return null }
            return inPwa ? null : line
        }
    }
    from(gameRoot) { include 'src/**', 'assets/**', 'fonts/**', 'privacy-policy.html', 'terms-of-use.html' }
    into gameAssets.map { it.dir('game') }
}

// Optional release signing: put these in android/keystore.properties (never commit it).
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) {
    ksFile.withInputStream { ks.load(it) }
    if (['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].any { !ks[it] }) {
        throw new GradleException('Upload signing configuration is incomplete; provide all four properties locally')
    }
}

android {
    namespace = 'com.lilopia.game'
    compileSdk 36

    defaultConfig {
        applicationId 'com.lilopia.game'
        minSdk 24
        targetSdk 36
        versionCode = providers.gradleProperty('versionCode').getOrElse('3').toInteger()
        versionName '1.0.1'
        def verifier = providers.gradleProperty('verificationUrl').getOrElse('')
        if (verifier && !(verifier ==~ /https:\/\/[a-zA-Z0-9.-]+(?::443)?\/[^\s"\\]*/)) {
            throw new GradleException('verificationUrl must be an HTTPS endpoint without quotes or escapes')
        }
        buildConfigField 'String', 'VERIFICATION_URL', '"' + verifier + '"'
    }

    signingConfigs {
        if (ks['storeFile']) {
            release {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // No debug fallback. Without an upload key, bundleRelease produces an unsigned AAB.
            if (ks['storeFile']) signingConfig signingConfigs.release
        }
    }

    buildFeatures { buildConfig = true }
    sourceSets {
        main.assets.srcDir gameAssets
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named('preBuild') { dependsOn copyGame }

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Align legacy jdk7/jdk8 transitive artifacts with the merged Kotlin standard library.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:2.2.21')
    implementation 'androidx.webkit:webkit:1.18.0'
    implementation 'com.android.billingclient:billing:9.1.0'
}
