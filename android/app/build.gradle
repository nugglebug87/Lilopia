plugins {
    id 'com.android.application'
}

// The game itself lives at the repository root (index.html, src/, assets/).
// It is copied into the APK at build time so there is one copy of the game to maintain.
def galaxyBuild = providers.gradleProperty('distribution').getOrElse('default') == 'galaxy'
def gameRoot = rootProject.file('..')
def gameAssets = layout.buildDirectory.dir('generated/gameAssets')

def copyGame = tasks.register('copyGame', Sync) {
    inputs.property('galaxyBuild', galaxyBuild)
    inputs.dir(gameRoot.toPath().resolve('distribution/galaxy').toFile())
    from(gameRoot) {
        include 'index.html'
        // The installable-web-app tags (manifest, icons) are not needed inside the app.
        def inPwa = false
        filter { String line ->
            if (line.contains('@@PWA-START@@')) { inPwa = true; return null }
            if (line.contains('@@PWA-END@@')) { inPwa = false; return null }
            if (galaxyBuild && line.contains('<script src="src/core.js">')) {
                return '<script>globalThis.LILOPIA_DISTRIBUTION = "galaxy";</script>' + line
            }
            return inPwa ? null : line
        }
    }
    from(gameRoot) { include 'src/**', 'assets/**', 'fonts/**', 'privacy-policy.html', 'terms-of-use.html' }
    if (galaxyBuild) {
        exclude 'privacy-policy.html', 'terms-of-use.html'
    }
    into gameAssets.map { it.dir('game') }
    doLast {
        if (galaxyBuild) {
            copy {
                from gameRoot.toPath().resolve('distribution/galaxy').toFile()
                include 'privacy-policy.html', 'terms-of-use.html'
                into gameAssets.get().dir('game').asFile
            }
        }
    }
}

// Optional release signing: put these in android/keystore.properties (never commit it).
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'com.lilopia.game'
    compileSdk 35

    defaultConfig {
        applicationId galaxyBuild ? 'com.lilopia.game.samsung' : 'com.lilopia.game'
        minSdk 24
        targetSdk 35
        versionCode galaxyBuild ? 2 : 1
        versionName galaxyBuild ? '0.1.1' : '0.1.0'
        manifestPlaceholders = [backupEnabled: galaxyBuild ? 'false' : 'true', extractionRules: galaxyBuild ? '@xml/galaxy_data_extraction_rules' : '@null']
    }

    signingConfigs {
        if (ks['storeFile']) {
            release {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Release builds without an upload key remain unsigned, never debug-signed.
            if (ks['storeFile']) signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main.assets.srcDir gameAssets
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named('preBuild') { dependsOn copyGame }

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
